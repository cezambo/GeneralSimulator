# Registro central de prompts.
#
# MUDANCA (31/07/2026): pipeline colapsado — profundidade por consciencia (B-014)
# + escalada por requestedDeepThinking. Roteador e intent removidos.
# Validador unico (gm.evaluate_high). Metas unificadas em cognition.goal_revise.
#
# Modelo nao e declarado aqui — apenas tier e capacidades.
# Binding tier -> modelo vive em config/models.json. Ver docs/03-CAMADA-LLM.md.

version: "3.0"

shared:
  rules_universal: "_shared/rules_universal.md"
  rules_agent: "_shared/rules_agent.md"
  rules_gm: "_shared/rules_gm.md"
  schemas_dir: "../schemas"

tiers:
  compact:
    desc: "Classificadores, instinto, saida curta. Volume altissimo."
    caps: [structured_outputs]
    defaultTemperature: 0.2
    defaultMaxTokens: 400
  narrative:
    desc: "Pensamento, social, Validador. Cavalo de batalha."
    caps: [structured_outputs, reasoning]
    defaultTemperature: 0.85
    defaultMaxTokens: 1200
  longform:
    desc: "Sumarizacao, construcao agentica. Contexto longo."
    caps: [structured_outputs, tools]
    min_context: 128000
    defaultTemperature: 0.6
    defaultMaxTokens: 2000

prompts:

  # ── PRE-JOGO / GERACAO ───────────────────────────────────────────────

  generation.scenario_to_terrain:
    file: "generation/scenario_to_terrain.md"
    tier: compact
    temperature: 0.3
    maxTokens: 600
    schema: terrain_params_response
    status: ok
    description: "Interpreta descricao do usuario -> TerrainParams"
    variables: [userScenario, numAgents, mapSizeDefault]

  generation.world_builder:
    file: "generation/world_builder.md"
    tier: longform
    temperature: 0.7
    maxTokens: 2000
    schema: null
    status: ok
    description: "Loop agentico com tool calls para construir a cidade"
    variables: [terrainSummary, requiredLocations, numAgents, toolResults]

  generation.agent_profile:
    file: "generation/agent_profile.md"
    tier: narrative
    temperature: 0.85
    maxTokens: 1200
    schema: agent_profile_response
    status: rascunho
    description: "Gera perfil inicial de agente coerente com o cenario"
    variables: [worldSummary, existingAgentsSummary, slotIndex, userScenario]

  generation.custom_item:
    file: "generation/custom_item.md"
    tier: narrative
    temperature: 0.7
    maxTokens: 800
    schema: item_definition
    status: rascunho
    description: "Item/movel customizado criado no modo construcao"
    variables: [userName, userDescription, userCategory, availableMaterials]

  # ── COGNICAO DO AGENTE ───────────────────────────────────────────────

  agent.thought.base_low:
    file: "agent/thought_base_low.md"
    tier: compact
    temperature: 1.0
    maxTokens: 400
    schema: agent_thought_response
    status: ok
    description: "Pensamento instintivo — consciencia < 0.70 (B-014)"
    variables: [agentContext, triggerType, triggerDetail, affordances, recentDenials]

  agent.thought.base_high:
    file: "agent/thought_base_high.md"
    tier: narrative
    temperature: 0.85
    maxTokens: 800
    schema: agent_thought_response
    status: ok
    description: "Pensamento corriqueiro — consciencia >= 0.70 (B-014)"
    variables: [agentContext, triggerType, triggerDetail, affordances, goalsSummary]

  agent.thought.reasoning:
    file: "agent/thought_reasoning.md"
    tier: narrative
    temperature: 0.8
    maxTokens: 2000
    reasoningEffort: medium
    schema: agent_thought_response
    status: ok
    description: "Deliberacao profunda — requestedDeepThinking ou gatilho grave"
    variables: [agentContext, triggerType, triggerDetail, affordances, goalsSummary, meetingContext]

  agent.personality_drift:
    file: "agent/personality_drift.md"
    tier: longform
    temperature: 0.6
    maxTokens: 1000
    schema: personality_drift_response
    status: falta
    description: "Ajusta tracos apos experiencias significativas"
    variables: [agentContext, personality, significantEvents, period]

  # ── MEMORIA ──────────────────────────────────────────────────────────

  # memory.marcantes_selection foi APOSENTADO por C-014.
  # A eleicao de marcantes passou a ser deterministica sobre a nota de
  # lembrabilidade que o agente ja atribui na propria resposta que decide a
  # acao (C-053). Pagar um modelo para reler o dia e reordenar informacao que
  # o agente produziu de graca era o pior negocio do lote noturno — e marcar
  # no instante e mais correto: o que fica de um dia nao e o que se julga
  # importante ao fim dele.

  memory.daily_summary:
    file: "memory/daily_summary.md"
    tier: longform
    temperature: 0.6
    maxTokens: 1500
    schema: memory_summary_response
    status: ok
    variables: [agentName, activityLog, bufferMarcantes, personality, opinionsSummary]

  memory.seasonal_summary:
    file: "memory/seasonal_summary.md"
    tier: longform
    temperature: 0.6
    maxTokens: 1500
    schema: memory_summary_response
    status: rascunho
    variables: [agentName, dailyMemoriesBlock, preservedMarcantes, personality]

  memory.longterm_summary:
    file: "memory/longterm_summary.md"
    tier: longform
    temperature: 0.6
    maxTokens: 2000
    schema: longterm_memory_response
    status: rascunho
    description: "Resumo acumulativo parametrizado por nivel (anual a era)"
    variables: [agentName, level, sourceMemoriesBlock, personality, relationshipsSummary]

  # ── OPINIOES ─────────────────────────────────────────────────────────

  cognition.dissonance_classifier:
    file: "cognition/dissonance_classifier.md"
    tier: compact
    temperature: 0.2
    maxTokens: 600
    schema: dissonance_classification_response
    status: rascunho
    prioridade: P0
    description: "Passagem a quente: classifica impressoes contra opinioes logo apos a conversa, para que a ruptura possa acontecer no mesmo dia"
    variables: [agentContext, existingOpinions, newImpressions, topicFilter]

  cognition.nightly_appraisal:
    file: "cognition/nightly_appraisal.md"
    tier: compact
    fallbackTier: narrative
    temperature: 0.3
    maxTokens: 1200
    schema: nightly_appraisal_response
    status: falta
    prioridade: P0
    description: "Apreciacao noturna: o Crivo e a passagem noturna do classificador numa chamada so"
    variables: [agentContext, existingOpinions, newImpressions, heardClaims, factBankSummary, topicFilter]
    porque: >
      C-047 e C-025. As duas tarefas leem o mesmo material do dia contra o mesmo
      contexto pessoal; separa-las pagaria uma chamada por agente por noite so
      para renderizar esse contexto duas vezes. O recuo esta declarado em C-047:
      duas tarefas estruturalmente distintas numa resposta e o que modelo pequeno
      erra primeiro, e se a fusao se mostrar instavel no tier compact, separar
      custa uma chamada por agente por noite — um numero conhecido.

  cognition.self_understanding:
    file: "cognition/self_understanding.md"
    tier: narrative
    temperature: 0.8
    maxTokens: 500
    schema: self_understanding_response
    status: falta
    prioridade: P1
    description: "Como o agente se ve agora, a partir do que viveu desde a ultima vez"
    variables: [agentContext, personality, recentMemories, previousSelfUnderstanding, period]

  cognition.opinion_burst:
    file: "cognition/opinion_burst.md"
    tier: narrative
    temperature: 0.9
    maxTokens: 600
    schema: opinion_burst_response
    status: rascunho
    variables: [agentContext, oldOpinion, dissonanceBuffer, personality]

  cognition.nightly_reflection:
    file: "cognition/nightly_reflection.md"
    tier: narrative
    temperature: 0.85
    maxTokens: 800
    schema: nightly_reflection_response
    status: falta
    description: "Lote noturno de opiniões gerais"
    variables: [agentContext, daySummary, generalOpinions, communityEvents]

  # ── OBJETIVOS ────────────────────────────────────────────────────────

  cognition.goal_revise:
    file: "cognition/goal_revise.md"
    tier: narrative
    temperature: 0.85
    maxTokens: 600
    schema: goal_revise_response
    status: rascunho
    description: "Revisao unificada de meta — qualquer nivel e gatilho"
    variables: [agentContext, goalLevel, triggerKind, currentGoals, triggerEvent, memoriesBlock, communityState, deprecatedGoal]

  cognition.whim_generation:
    file: "cognition/whim_generation.md"
    tier: compact
    temperature: 0.7
    maxTokens: 300
    schema: whim_response
    status: falta
    description: "Capricho: impulso de minutos"
    variables: [agentContext, personality, boredomLevel, nearbyAffordances]

  # ── SOCIAL ───────────────────────────────────────────────────────────

  social.handshake:
    file: "social/handshake.md"
    tier: compact
    temperature: 0.2
    maxTokens: 300
    schema: handshake_response
    status: falta
    description: "Checa disponibilidade para conversa"
    variables: [initiatorContext, targetContext, spatialContext]

  social.conversation_turn:
    file: "social/conversation_turn.md"
    tier: narrative
    temperature: 0.85
    maxTokens: 800
    schema: conversation_turn_response
    status: ok
    variables: [agentContext, conversationTranscript, participants, turnBudget, spatialContext]

  social.relocation_vote:
    file: "social/relocation_vote.md"
    tier: compact
    temperature: 0.3
    maxTokens: 300
    schema: relocation_vote_response
    status: falta
    variables: [agentContext, proposal, currentLocation, targetLocation]

  social.post_conversation:
    file: "social/post_conversation.md"
    tier: narrative
    temperature: 0.85
    maxTokens: 600
    schema: post_conversation_response
    status: ok
    variables: [agentContext, conversationTranscript, participants]

  # ── COMUNIDADE ───────────────────────────────────────────────────────

  community.meeting_turn:
    file: "community/meeting_turn.md"
    tier: narrative
    temperature: 0.8
    maxTokens: 1200
    reasoningEffort: medium
    schema: conversation_turn_response
    status: rascunho
    variables: [agentContext, meetingType, meetingTranscript, communityLaws, colonyState]

  community.meeting_verdict:
    file: "community/meeting_verdict.md"
    tier: narrative
    temperature: 0.7
    maxTokens: 1500
    reasoningEffort: medium
    schema: meeting_verdict_response
    status: ok
    variables: [meetingType, meetingTranscript, participants, colonyState]

  # ── GAME MASTER ──────────────────────────────────────────────────────
  # Validador trivial: affordance declarada resolve na engine — sem LLM.
  # Grito de combate: fato perceptivel + viés de relação (A-029), sem prompt extra.

  gm.evaluate_high:
    file: "gm/evaluate_high.md"
    tier: narrative
    temperature: 0.5
    maxTokens: 1500
    schema: gm_response
    status: ok
    description: "Unico Validador — emite generalization cross-domain"
    variables: [intent, agentSnapshot, targetSnapshot, worldSnapshot, userInstructions, substrateSnapshot, matrixSummary, bodySnapshot, injurySummary, allowedOperations, plausibilityRegistry]
